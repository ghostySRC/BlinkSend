name: Browser E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: BROWSER=${{ matrix.browser }} node scripts/browser-e2e.mjs
