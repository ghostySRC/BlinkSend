name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run bench
      - run: npm run loadtest
      - run: docker build -t blinksend-ci .
      - name: Smoke-test container and graceful shutdown
        run: |
          cid=$(docker run -d -p 127.0.0.1:3080:3000 blinksend-ci)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3080/health >/dev/null; then break; fi
            sleep 0.5
          done
          curl --fail --silent http://127.0.0.1:3080/health | grep '"status":"ok"'
          docker stop -t 5 "$cid" >/dev/null
