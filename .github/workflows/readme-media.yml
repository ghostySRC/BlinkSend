name: Refresh README media

on:
  push:
    branches:
      - v0.3/session-queue-diagnostics
    paths:
      - scripts/capture-readme-media.mjs
      - .github/workflows/readme-media.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: node scripts/capture-readme-media.mjs
      - name: Commit real browser captures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/media/desktop.webp docs/media/mobile.webp docs/media/mobile-dark.webp docs/media/pairing.gif docs/media/transfer.gif docs/media/queue.gif
          if git diff --cached --quiet; then
            echo "README media already current."
            exit 0
          fi
          git commit -m "Capture real BlinkSend README media"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
