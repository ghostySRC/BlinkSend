name: Refresh README media

on:
  push:
    branches:
      - docs/visual-showcase-v2
    paths:
      - scripts/generate-readme-media.py
      - .github/workflows/readme-media.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - run: python scripts/generate-readme-media.py
      - name: Commit refreshed media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/media/desktop.webp docs/media/mobile.webp docs/media/mobile-dark.webp docs/media/pairing.gif docs/media/transfer.gif
          if git diff --cached --quiet; then
            echo "README media already current."
            exit 0
          fi
          git commit -m "Refresh README visuals for v0.2.0"
          git push origin HEAD:${GITHUB_REF_NAME}
